<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connection Map — Cross-Agent Knowledge Graph</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #050508; color: #e0e0e0; font-family: 'Courier New', monospace; overflow: hidden; }
#graph { width: 100vw; height: 100vh; }

#info-panel {
  position: fixed; top: 16px; right: 16px; width: 380px; max-height: calc(100vh - 32px);
  background: rgba(8, 8, 16, 0.95); border: 1px solid rgba(100, 200, 255, 0.15);
  border-radius: 10px; padding: 20px; overflow-y: auto; display: none;
  font-size: 12px; z-index: 10;
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
}
#info-panel h3 { color: #fff; margin-bottom: 6px; font-size: 15px; font-family: 'Courier New', monospace; }
#info-panel .type-badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 10px; margin-bottom: 10px; text-transform: uppercase;
  letter-spacing: 0.05em;
}
#info-panel .summary { color: #99a; margin-bottom: 14px; line-height: 1.5; font-size: 12px; }
#info-panel .skeleton-box {
  background: rgba(224, 108, 117, 0.1); border: 1px solid rgba(224, 108, 117, 0.3);
  border-radius: 6px; padding: 10px 12px; margin-bottom: 14px; font-size: 11px;
  color: #e06c75; line-height: 1.4;
}
#info-panel .skeleton-box .label { font-size: 9px; text-transform: uppercase; color: #e06c75; opacity: 0.7; margin-bottom: 4px; letter-spacing: 0.08em; }
#info-panel .source-btn {
  display: inline-block; padding: 6px 14px; border-radius: 6px;
  background: rgba(100, 200, 255, 0.1); border: 1px solid rgba(100, 200, 255, 0.25);
  color: #7df; font-size: 11px; text-decoration: none; margin-bottom: 14px;
  transition: all 0.2s;
}
#info-panel .source-btn:hover { background: rgba(100, 200, 255, 0.2); border-color: rgba(100, 200, 255, 0.5); }
#info-panel .connections { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px; }
#info-panel .conn-item { padding: 4px 0; font-size: 11px; color: #667; }
#info-panel .conn-item .pred { color: #556; font-style: italic; }
#info-panel .conn-item .target { color: #aab; cursor: pointer; }
#info-panel .conn-item .target:hover { color: #fff; }
#info-panel .conn-item .structural-badge {
  display: inline-block; font-size: 8px; padding: 1px 5px; border-radius: 8px;
  background: rgba(224, 108, 117, 0.3); color: #e06c75; margin-left: 4px;
  vertical-align: middle; letter-spacing: 0.03em;
}

#legend {
  position: fixed; bottom: 16px; left: 16px;
  background: rgba(8, 8, 16, 0.9); border: 1px solid rgba(100, 200, 255, 0.1);
  border-radius: 10px; padding: 14px 18px; font-size: 11px; z-index: 10;
}
#legend h4 { margin-bottom: 6px; color: #556; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
#legend .legend-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
#legend .legend-dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 6px; }
#legend .legend-line { width: 22px; height: 0; border-top: 2px solid; }

#title-bar {
  position: fixed; top: 16px; left: 16px;
  background: rgba(8, 8, 16, 0.9); border: 1px solid rgba(100, 200, 255, 0.1);
  border-radius: 10px; padding: 14px 18px; z-index: 10;
}
#title-bar h1 { font-size: 16px; font-weight: 600; color: #dde; letter-spacing: 0.02em; }
#title-bar p { font-size: 10px; color: #556; margin-top: 4px; }

#filters {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(8, 8, 16, 0.95); border: 1px solid rgba(100, 200, 255, 0.1);
  border-radius: 10px; padding: 10px 18px; font-size: 11px; z-index: 10;
  display: flex; gap: 14px; align-items: center;
}
#filters .filter-group { display: flex; gap: 8px; align-items: center; }
#filters label { color: #778; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 4px; transition: color 0.2s; }
#filters label:hover { color: #dde; }
#filters input[type="checkbox"] { accent-color: #55eecc; width: 13px; height: 13px; }
#filters .divider { width: 1px; height: 20px; background: rgba(255,255,255,0.08); }
#filters .filter-label { color: #445; text-transform: uppercase; font-size: 9px; letter-spacing: 0.08em; }

#cosine-ctrl { display: flex; align-items: center; gap: 5px; }
#cosine-ctrl .cosine-label { color: #e8943a; font-size: 10px; white-space: nowrap; }
#cosine-ctrl .cosine-btn {
  background: rgba(232,148,58,0.15); color: #e8943a; border: 1px solid rgba(232,148,58,0.35);
  border-radius: 4px; width: 20px; height: 20px; font-size: 13px; line-height: 1;
  cursor: pointer; font-family: 'Courier New', monospace; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
#cosine-ctrl .cosine-btn:hover { background: rgba(232,148,58,0.3); border-color: rgba(232,148,58,0.6); }
#cosine-val { color: #e8943a; font-size: 11px; min-width: 30px; text-align: center; font-weight: bold; }

#edge-dropdown-wrap { position: relative; }
#edge-dropdown-btn {
  background: #0a0a14; color: #778; border: 1px solid rgba(100,200,255,0.2);
  border-radius: 6px; padding: 4px 12px; font-size: 11px; cursor: pointer;
  font-family: 'Courier New', monospace; transition: all 0.2s;
}
#edge-dropdown-btn:hover { color: #dde; border-color: rgba(100,200,255,0.4); }
#edge-dropdown-menu {
  position: absolute; top: 100%; left: 0; width: 220px;
  background: rgba(8,8,16,0.97); border: 1px solid rgba(100,200,255,0.15);
  border-radius: 6px; margin-top: 4px; display: none; z-index: 20;
  padding: 8px 0;
}
#edge-dropdown-menu label {
  display: flex; align-items: center; gap: 6px; padding: 5px 14px;
  color: #778; cursor: pointer; font-size: 11px; transition: background 0.15s;
}
#edge-dropdown-menu label:hover { background: rgba(100,200,255,0.06); color: #dde; }
#edge-dropdown-menu .edge-sep {
  height: 1px; background: rgba(255,255,255,0.06); margin: 4px 10px;
}

#search-wrap { position: relative; }
#search-input {
  background: #0a0a14; color: #dde; border: 1px solid rgba(100,200,255,0.2);
  border-radius: 6px; padding: 4px 10px; font-size: 11px; width: 180px;
  font-family: 'Courier New', monospace; outline: none; transition: border-color 0.2s;
}
#search-input:focus { border-color: rgba(100,200,255,0.5); }
#search-input::placeholder { color: #445; }
#search-results {
  position: absolute; top: 100%; left: 0; width: 260px; max-height: 240px;
  overflow-y: auto; background: rgba(8,8,16,0.97); border: 1px solid rgba(100,200,255,0.15);
  border-radius: 6px; margin-top: 4px; display: none; z-index: 20;
}
#search-results .sr-item {
  padding: 6px 10px; cursor: pointer; font-size: 11px; display: flex;
  justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.04);
}
#search-results .sr-item:hover { background: rgba(100,200,255,0.08); }
#search-results .sr-item .sr-origin { font-size: 9px; opacity: 0.5; text-transform: uppercase; }
#search-results .sr-empty { padding: 10px; color: #445; font-size: 11px; text-align: center; }

#stats {
  position: fixed; bottom: 16px; right: 16px;
  background: rgba(8, 8, 16, 0.9); border: 1px solid rgba(100, 200, 255, 0.1);
  border-radius: 10px; padding: 8px 14px; font-size: 10px; color: #445; z-index: 10;
}

svg text { pointer-events: none; }
</style>
</head>
<body>
<div id="graph"></div>
<div id="title-bar">
  <h1>Connection Map</h1>
  <p>Cross-agent knowledge graph</p>
</div>
<div id="filters">
  <div id="search-wrap">
    <input type="text" id="search-input" placeholder="Search nodes...">
    <div id="search-results"></div>
  </div>
  <div class="divider"></div>
  <span class="filter-label">Agents</span>
  <div class="filter-group">
    <label><input type="checkbox" id="f-loom" checked> <span style="color:#55ccff">Loom</span></label>
    <label><input type="checkbox" id="f-sammy" checked> <span style="color:#ff66aa">Sammy</span></label>
    <label><input type="checkbox" id="f-isotopy" checked> <span style="color:#aa77ff">Isotopy</span></label>
    <label><input type="checkbox" id="f-shared" checked> <span style="color:#55eecc">Shared</span></label>
  </div>
  <div class="divider"></div>
  <div id="edge-dropdown-wrap">
    <button id="edge-dropdown-btn">Edge types ▾</button>
    <div id="edge-dropdown-menu">
      <label><input type="checkbox" class="edge-filter" data-pred="cosine_similarity" checked> <span style="color:#e8943a">● Cosine similarity</span> <span style="color:#667;margin-left:auto">8283</span></label>
      <label><input type="checkbox" class="edge-filter" data-pred="structural_isomorphism" checked> <span style="color:#e06c75">◆ Structural isomorphism</span> <span style="color:#667;margin-left:auto">26</span></label>
      <div class="edge-sep"></div>
      <label><input type="checkbox" class="edge-filter" data-pred="authored_by" checked> <span style="color:#55eecc">● Authored by</span> <span style="color:#667;margin-left:auto">190</span></label>
      <label><input type="checkbox" class="edge-filter" data-pred="related_to" checked> <span style="color:#b4bed2">● Related to</span> <span style="color:#667;margin-left:auto">267</span></label>
      <label><input type="checkbox" class="edge-filter" data-pred="instance_of" checked> <span style="color:#b4bed2">● Instance of</span> <span style="color:#667;margin-left:auto">17</span></label>
      <label><input type="checkbox" class="edge-filter" data-pred="corresponds_with" checked> <span style="color:#55eecc">● Corresponds with</span> <span style="color:#667;margin-left:auto">13</span></label>
      <label><input type="checkbox" class="edge-filter" data-pred="contrasts_with" checked> <span style="color:#b4bed2">● Contrasts with</span> <span style="color:#667;margin-left:auto">12</span></label>
      <div class="edge-sep"></div>
      <label><input type="checkbox" class="edge-filter" data-pred="convergent_with" checked> <span style="color:#ffcc55">● Convergent with</span> <span style="color:#667;margin-left:auto">10</span></label>
      <label><input type="checkbox" class="edge-filter" data-pred="structural_analog_of" checked> <span style="color:#ff9966">● Structural analog</span> <span style="color:#667;margin-left:auto">8</span></label>
      <label><input type="checkbox" class="edge-filter" data-pred="describes_mechanism_of" checked> <span style="color:#b4bed2">● Describes mechanism</span> <span style="color:#667;margin-left:auto">9</span></label>
      <label><input type="checkbox" class="edge-filter" data-pred="same_phenomenon" checked> <span style="color:#b4bed2">● Same phenomenon</span> <span style="color:#667;margin-left:auto">5</span></label>
    </div>
  </div>
  <div class="divider"></div>
  <div id="cosine-ctrl">
    <span class="cosine-label">Cosine ≥</span>
    <button class="cosine-btn" id="cosine-minus">−</button>
    <span id="cosine-val">0.40</span>
    <button class="cosine-btn" id="cosine-plus">+</button>
  </div>
  <div class="divider"></div>
  <div class="filter-group">
    <label><input type="checkbox" id="f-cross-only"> Cross-agent only</label>
    <label style="gap:2px"><span style="color:#e06c75">Neighborhood</span>
      <select id="f-neighborhood" style="background:#0a0a14;color:#e06c75;border:1px solid rgba(224,108,117,0.3);border-radius:4px;padding:1px 4px;font-size:10px;font-family:'Courier New',monospace;">
        <option value="0">off</option>
        <option value="1">1-hop</option>
        <option value="2">2-hop</option>
      </select>
    </label>
  </div>
</div>
<div id="legend">
  <h4>Node Origin</h4>
  <div class="legend-item"><div class="legend-dot" style="background:#55ccff; box-shadow:0 0 8px #55ccff"></div> Loom</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff66aa; box-shadow:0 0 8px #ff66aa"></div> Sammy</div>
  <div class="legend-item"><div class="legend-dot" style="background:#aa77ff; box-shadow:0 0 8px #aa77ff"></div> Isotopy</div>
  <div class="legend-item"><div class="legend-dot" style="background:#55eecc; box-shadow:0 0 8px #55eecc"></div> Shared</div>
  <h4 style="margin-top:10px">Edge Type</h4>
  <div class="legend-item"><div class="legend-line" style="border-color:#e8943a"></div> Cosine similarity</div>
  <div class="legend-item"><div class="legend-line" style="border-color:#e06c75; border-style:dashed"></div> Structural isomorphism</div>
  <div class="legend-item"><div class="legend-line" style="border-color:#55eecc"></div> Authored by</div>
  <div class="legend-item"><div class="legend-line" style="border-color:rgba(180,190,210,0.55)"></div> Curated (other)</div>
</div>
<div id="stats"></div>
<div id="info-panel">
  <h3 id="info-name"></h3>
  <div class="type-badge" id="info-type"></div>
  <div id="info-skeleton" style="display:none"></div>
  <div class="summary" id="info-summary"></div>
  <div id="info-source" style="display:none"></div>
  <div class="connections" id="info-connections"></div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const originColors = {
  loom: '#55ccff',
  sammy: '#ff66aa',
  isotopy: '#aa77ff',
  shared: '#55eecc'
};

let allData, simulation, svg, g, zoom, defs;
let currentNodes = [], currentEdges = [];

function getColor(d) { return originColors[d.origin] || '#556'; }

const edgeColors = {
  cosine_similarity: '#e8943a',
  structural_isomorphism: '#e06c75',
  authored_by: '#55eecc',
  corresponds_with: '#55eecc',
  related_to: 'rgba(180,190,210,0.55)',
  instance_of: 'rgba(180,190,210,0.55)',
  contrasts_with: 'rgba(180,190,210,0.55)',
  convergent_with: '#ffcc55',
  structural_analog_of: '#ff9966',
  same_phenomenon: 'rgba(180,190,210,0.55)',
  describes_mechanism_of: 'rgba(180,190,210,0.55)',
};

function getFilterState() {
  const enabledPreds = new Set();
  document.querySelectorAll('.edge-filter').forEach(el => {
    if (el.checked) enabledPreds.add(el.dataset.pred);
  });
  return {
    origins: {
      loom: document.getElementById('f-loom').checked,
      sammy: document.getElementById('f-sammy').checked,
      isotopy: document.getElementById('f-isotopy').checked,
      shared: document.getElementById('f-shared').checked,
    },
    enabledPreds,
    cosineMin: parseFloat(document.getElementById('cosine-val').textContent),
    crossOnly: document.getElementById('f-cross-only').checked,
    neighborhoodHops: parseInt(document.getElementById('f-neighborhood').value) || 0,
  };
}

function applyFilters() {
  const f = getFilterState();
  let filteredEdges = allData.edges.filter(e => {
    if (!f.enabledPreds.has(e.predicate)) return false;
    if (e.predicate === 'cosine_similarity' && e.weight < f.cosineMin) return false;
    if (f.crossOnly && !e.cross_agent) return false;
    return true;
  });

  if (f.neighborhoodHops > 0 && f.enabledPreds.has('structural_isomorphism')) {
    const structuralNodes = new Set();
    allData.edges.forEach(e => {
      if (e.predicate === 'structural_isomorphism') {
        structuralNodes.add(e.source);
        structuralNodes.add(e.target);
      }
    });
    let currentFrontier = new Set(structuralNodes);
    const neighborEdges = [];
    for (let hop = 0; hop < f.neighborhoodHops; hop++) {
      const nextFrontier = new Set();
      allData.edges.forEach(e => {
        if (e.edge_type !== 'structural' && f.enabledPreds.has(e.predicate) && (currentFrontier.has(e.source) || currentFrontier.has(e.target))) {
          neighborEdges.push(e);
          nextFrontier.add(e.source);
          nextFrontier.add(e.target);
        }
      });
      currentFrontier = nextFrontier;
    }
    const existingEdgeKeys = new Set(filteredEdges.map(e => e.source + '|' + e.target));
    neighborEdges.forEach(e => {
      if (!existingEdgeKeys.has(e.source + '|' + e.target)) {
        filteredEdges.push(e);
      }
    });
  }

  const filteredEdgeNodeIds = new Set();
  filteredEdges.forEach(e => { filteredEdgeNodeIds.add(e.source); filteredEdgeNodeIds.add(e.target); });
  const filteredNodes = allData.nodes.filter(n => {
    if (!f.origins[n.origin]) return false;
    return filteredEdgeNodeIds.has(n.id);
  });
  const nodeIds = new Set(filteredNodes.map(n => n.id));
  const validEdges = filteredEdges.filter(e => nodeIds.has(e.source) && nodeIds.has(e.target));
  let label = '';
  const predCount = f.enabledPreds.size;
  if (predCount === 1) label = ` (${[...f.enabledPreds][0]} only)`;
  else if (predCount < 11) label = ` (${predCount} edge types)`;
  if (f.neighborhoodHops > 0) label += ` (+${f.neighborhoodHops}-hop)`;
  if (f.crossOnly) label += ' (cross-agent)';
  document.getElementById('stats').textContent =
    `${filteredNodes.length} nodes · ${validEdges.length} edges` + label;
  renderGraph(filteredNodes, validEdges);
}

function renderGraph(nodes, edges) {
  g.selectAll('*').remove();
  if (simulation) simulation.stop();
  const width = window.innerWidth;
  const height = window.innerHeight;
  const nodesCopy = nodes.map(d => ({...d}));
  const edgesCopy = edges.map(d => ({...d}));

  simulation = d3.forceSimulation(nodesCopy)
    .force('link', d3.forceLink(edgesCopy).id(d => d.id).distance(55))
    .force('charge', d3.forceManyBody().strength(-70))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(14));

  const link = g.append('g')
    .selectAll('line')
    .data(edgesCopy)
    .join('line')
    .attr('stroke', d => edgeColors[d.predicate] || 'rgba(255,255,255,0.15)')
    .attr('stroke-width', d => d.predicate === 'structural_isomorphism' ? 2.0 : d.predicate === 'convergent_with' || d.predicate === 'structural_analog_of' ? 1.4 : 1.0)
    .attr('stroke-opacity', d => d.predicate === 'structural_isomorphism' ? 0.8 : d.predicate === 'cosine_similarity' ? 0.3 : 0.5)
    .attr('stroke-dasharray', d => d.predicate === 'structural_isomorphism' ? '5,4' : null);

  // Precompute degree per node
  const degreeMap = {};
  nodesCopy.forEach(n => { degreeMap[n.id] = 0; });
  edgesCopy.forEach(e => {
    const sid = typeof e.source === 'object' ? e.source.id : e.source;
    const tid = typeof e.target === 'object' ? e.target.id : e.target;
    if (degreeMap[sid] !== undefined) degreeMap[sid]++;
    if (degreeMap[tid] !== undefined) degreeMap[tid]++;
  });
  nodesCopy.forEach(n => { n._degree = degreeMap[n.id] || 0; });

  // Node layer
  const node = g.append('g')
    .selectAll('circle')
    .data(nodesCopy)
    .join('circle')
    .attr('class', 'node-circle')
    .attr('r', d => Math.max(4, Math.min(16, 3 + d._degree * 1.0)))
    .attr('fill', d => getColor(d))
    .attr('stroke', d => getColor(d))
    .attr('stroke-width', 0.5)
    .attr('stroke-opacity', 0.3)
    .attr('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (event) => {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
      })
      .on('drag', (event) => {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
      })
      .on('end', (event) => {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
      }));



  const labels = g.append('g')
    .selectAll('text')
    .data(nodesCopy.filter(d => d._degree >= 4))
    .join('text')
    .text(d => d.id.length > 30 ? d.id.slice(0, 28) + '...' : d.id)
    .attr('font-size', '9px')
    .attr('fill', d => getColor(d))
    .attr('fill-opacity', 0.6)
    .attr('dx', 14)
    .attr('dy', 3)
    .attr('font-family', "'Courier New', monospace");

  node.on('click', (event, d) => {
    event.stopPropagation();
    // Clear previous selection
    nodesCopy.forEach(n => { n._selected = false; });
    d._selected = true;

    const panel = document.getElementById('info-panel');
    panel.style.display = 'block';
    document.getElementById('info-name').textContent = d.id;
    const badge = document.getElementById('info-type');
    badge.textContent = d.type + ' · ' + d.origin;
    badge.style.background = getColor(d);
    badge.style.color = '#050508';

    const skelBox = document.getElementById('info-skeleton');
    if (d.skeleton) {
      skelBox.style.display = 'block';
      skelBox.className = 'skeleton-box';
      skelBox.innerHTML = `<div class="label">Structural skeleton</div>${d.skeleton}`;
    } else {
      skelBox.style.display = 'none';
    }

    document.getElementById('info-summary').textContent = d.summary || '(no summary)';

    const srcDiv = document.getElementById('info-source');
    if (d.source_url) {
      srcDiv.style.display = 'block';
      srcDiv.innerHTML = `<a class="source-btn" href="${d.source_url}" target="_blank" rel="noopener">View source material &rarr;</a>`;
    } else {
      srcDiv.style.display = 'none';
    }

    const conns = edgesCopy.filter(e => e.source.id === d.id || e.target.id === d.id);
    const connIds = new Set();
    conns.forEach(e => { connIds.add(e.source.id); connIds.add(e.target.id); });
    const connHtml = conns.map(e => {
      const isSource = e.source.id === d.id;
      const other = isSource ? e.target.id : e.source.id;
      const dir = isSource ? '&rarr;' : '&larr;';
      const structBadge = e.predicate === 'structural_isomorphism' ? '<span class="structural-badge">structural isomorphism</span>' : '';
      return `<div class="conn-item">${dir} <span class="pred">${e.predicate || e.relation || ''}</span> <span class="target" data-id="${other}">${other}</span>${structBadge}</div>`;
    }).join('');
    document.getElementById('info-connections').innerHTML = conns.length ? connHtml : '<div class="conn-item">No connections</div>';

    node.attr('opacity', n => connIds.has(n.id) ? 1 : 0.08);
    link.attr('stroke-opacity', e => e.source.id === d.id || e.target.id === d.id ? 1 : 0.02);
    labels.attr('fill-opacity', n => connIds.has(n.id) ? 0.9 : 0.05);
  });

  document.getElementById('info-connections').addEventListener('click', (e) => {
    if (e.target.classList.contains('target')) {
      const id = e.target.dataset.id;
      node.filter(n => n.id === id).dispatch('click');
    }
  });

  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('cx', d => d.x).attr('cy', d => d.y);
    labels.attr('x', d => d.x).attr('y', d => d.y);
  });

  currentNodes = nodesCopy;
  currentEdges = edgesCopy;
}

fetch('graph-data.json').then(r => r.json()).then(data => {
  allData = data;
  const width = window.innerWidth;
  const height = window.innerHeight;

  svg = d3.select('#graph')
    .append('svg')
    .attr('width', width)
    .attr('height', height);

  defs = svg.append('defs');

  g = svg.append('g');

  zoom = d3.zoom()
    .scaleExtent([0.08, 6])
    .on('zoom', (event) => g.attr('transform', event.transform));
  svg.call(zoom);

  svg.on('click', (event) => {
    if (event.target === svg.node()) {
      document.getElementById('info-panel').style.display = 'none';
      if (currentNodes) currentNodes.forEach(n => { n._selected = false; });
      // Reset nodes to visible, glow circles to hidden
      g.selectAll('.node-circle').attr('opacity', 1);
      g.selectAll('line').attr('stroke-opacity', d => d && d.predicate === 'structural_isomorphism' ? 0.8 : d && d.predicate === 'cosine_similarity' ? 0.3 : 0.5);
      g.selectAll('text').attr('fill-opacity', 0.6);
    }
  });

  document.querySelectorAll('#filters input, #filters select, .edge-filter').forEach(el => {
    el.addEventListener('change', applyFilters);
  });

  const cosineVal = document.getElementById('cosine-val');
  let cosineMin = 0.40;
  function updateCosine(delta) {
    cosineMin = Math.round((cosineMin + delta) * 100) / 100;
    if (cosineMin < 0.10) cosineMin = 0.10;
    if (cosineMin > 0.80) cosineMin = 0.80;
    cosineVal.textContent = cosineMin.toFixed(2);
    applyFilters();
  }
  document.getElementById('cosine-minus').addEventListener('click', () => updateCosine(-0.05));
  document.getElementById('cosine-plus').addEventListener('click', () => updateCosine(0.05));

  // Edge type dropdown toggle
  const edgeBtn = document.getElementById('edge-dropdown-btn');
  const edgeMenu = document.getElementById('edge-dropdown-menu');
  edgeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    edgeMenu.style.display = edgeMenu.style.display === 'block' ? 'none' : 'block';
  });
  edgeMenu.addEventListener('click', (e) => e.stopPropagation());
  document.addEventListener('click', () => { edgeMenu.style.display = 'none'; });

  // Apply URL parameters
  const params = new URLSearchParams(window.location.search);

  // Edge type filters: ?edges=structural | ?edges=curated | ?edges=cosine | ?edges=pred1,pred2
  const edgesParam = params.get('edges');
  if (edgesParam) {
    const requested = edgesParam.toLowerCase().split(',').map(s => s.trim());
    // Map shorthand names
    const shorthand = {
      'structural': ['structural_isomorphism'],
      'curated': ['authored_by','related_to','instance_of','corresponds_with','contrasts_with','convergent_with','structural_analog_of','same_phenomenon','describes_mechanism_of'],
      'cosine': ['cosine_similarity'],
    };
    const enablePreds = new Set();
    requested.forEach(r => {
      if (shorthand[r]) shorthand[r].forEach(p => enablePreds.add(p));
      else enablePreds.add(r);
    });
    document.querySelectorAll('.edge-filter').forEach(el => {
      el.checked = enablePreds.has(el.dataset.pred);
    });
  }
  // Legacy support
  if (params.get('structural') === 'true') {
    document.querySelectorAll('.edge-filter').forEach(el => {
      el.checked = el.dataset.pred === 'structural_isomorphism';
    });
  }

  const neighborhoodParam = params.get('neighborhood');
  if (neighborhoodParam === 'true' || neighborhoodParam === '2') {
    document.getElementById('f-neighborhood').value = '2';
  } else if (neighborhoodParam === '1') {
    document.getElementById('f-neighborhood').value = '1';
  }
  if (params.get('cross') === 'true') {
    document.getElementById('f-cross-only').checked = true;
  }

  // Agent/origin filters: ?origin=loom,sammy (comma-separated, only listed origins shown)
  const originParam = params.get('origin');
  if (originParam) {
    const origins = originParam.toLowerCase().split(',').map(s => s.trim());
    ['loom', 'sammy', 'isotopy', 'shared'].forEach(o => {
      document.getElementById('f-' + o).checked = origins.includes(o);
    });
  }

  applyFilters();

  const targetNode = params.get('node');
  if (targetNode) {
    setTimeout(() => {
      const match = currentNodes.find(n => n.id.toLowerCase() === targetNode.toLowerCase());
      if (match) {
        // Center on the node
        const scale = 1.5;
        svg.transition().duration(1000).call(
          zoom.transform,
          d3.zoomIdentity.translate(width/2 - match.x * scale, height/2 - match.y * scale).scale(scale)
        );
        // Simulate click after centering
        setTimeout(() => {
          g.selectAll('.node-circle').filter(n => n.id === match.id).dispatch('click');
        }, 1200);
      }
    }, 2500);
  } else {
    setTimeout(() => {
      svg.call(zoom.transform, d3.zoomIdentity.translate(width/4, height/4).scale(0.45));
    }, 2000);
  }
  // Search
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q || !allData) { searchResults.style.display = 'none'; return; }
    const matches = allData.nodes
      .filter(n => n.id.toLowerCase().includes(q) || (n.summary && n.summary.toLowerCase().includes(q)))
      .slice(0, 12);
    if (!matches.length) {
      searchResults.innerHTML = '<div class="sr-empty">No matches</div>';
    } else {
      searchResults.innerHTML = matches.map(n =>
        `<div class="sr-item" data-id="${n.id}"><span style="color:${originColors[n.origin] || '#aab'}">${n.id}</span><span class="sr-origin">${n.origin}</span></div>`
      ).join('');
    }
    searchResults.style.display = 'block';
  });

  searchResults.addEventListener('click', (e) => {
    const item = e.target.closest('.sr-item');
    if (!item) return;
    const id = item.dataset.id;
    searchInput.value = '';
    searchResults.style.display = 'none';
    const match = currentNodes.find(n => n.id === id);
    if (match) {
      const scale = 1.5;
      svg.transition().duration(800).call(
        zoom.transform,
        d3.zoomIdentity.translate(window.innerWidth/2 - match.x * scale, window.innerHeight/2 - match.y * scale).scale(scale)
      );
      setTimeout(() => {
        g.selectAll('.node-circle').filter(n => n.id === id).dispatch('click');
      }, 900);
    }
  });

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { searchResults.style.display = 'none'; searchInput.blur(); }
    if (e.key === 'Enter') {
      const first = searchResults.querySelector('.sr-item');
      if (first) first.click();
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#search-wrap')) searchResults.style.display = 'none';
  });

  // URL param: ?search=term
  const searchParam = params.get('search');
  if (searchParam) {
    searchInput.value = searchParam;
    searchInput.dispatchEvent(new Event('input'));
  }
});
</script>
</body>
</html>
